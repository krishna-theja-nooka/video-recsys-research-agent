name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Create isolated Python environment
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import venv

          root = pathlib.Path(".venv").resolve()
          venv.EnvBuilder(with_pip=True).create(root)
          scripts = root / ("Scripts" if os.name == "nt" else "bin")

          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as file:
              file.write(str(scripts) + "\n")
          PY

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: Install project
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Check dependencies
        run: python -m pip check

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q --junitxml=ci-test-results.xml

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            ci-test-results.xml
            dist/*.whl

  spark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Spark test dependencies
        run: python -m pip install numpy==2.2.6 pytest==8.3.5 pyspark==3.5.5

      - name: Test Spark preprocessing
        run: python -m pytest tests/test_spark.py -q
        env:
          RUN_SPARK_TESTS: '1'
          SPARK_LOCAL_IP: 127.0.0.1
