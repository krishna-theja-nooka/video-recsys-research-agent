name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Determine version
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Use a numeric major.minor.patch version')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'TAG=v{version}\n')
          PY
      - name: Check existing release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists. Increment the project version for a new release."
            exit 1
          fi
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m build --wheel --no-isolation
      - name: Publish source and wheel
        run: |
          git archive --format=zip --prefix=video-recsys-research-agent/ -o "video-recsys-research-agent-$TAG.zip" HEAD
          gh release create "$TAG" --target "$GITHUB_SHA" --title "FrameLab $TAG" --notes-file RELEASE_NOTES.md "video-recsys-research-agent-$TAG.zip" dist/*.whl
