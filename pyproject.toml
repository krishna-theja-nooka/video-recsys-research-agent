[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "video-recsys-research-agent"
version = "0.1.0"
description = "Reproducible recommendation experiments and a bounded data-improvement agent"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["numpy==2.2.6", "torch==2.6.0", "transformers==4.51.3", "mlflow==2.22.0", "optuna==4.3.0", "langgraph==0.4.8"]
[project.optional-dependencies]
spark = ["pyspark==3.5.5"]
dev = ["pytest==8.3.5", "ruff==0.11.13", "build==1.2.2.post1"]
[project.scripts]
reclab = "reclab.cli:main"
[tool.setuptools.packages.find]
include = ["reclab*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
